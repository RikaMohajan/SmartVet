<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / লগইন - SmartVet</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="login-box">
        <h1>Login / লগইন</h1>

        {% if error %}
            <p style="color:red;">{{ error }}</p>
        {% endif %}

        <form method="POST" action="/login">
            <input type="email" name="email" placeholder="Email / ইমেইল" required>
            <input type="password" name="password" placeholder="Password / পাসওয়ার্ড" required>
            <button type="submit">Login / লগইন</button>
        </form>

        <p style="margin-top:15px;">
            New user? / নতুন ব্যবহারকারী? <a href="/register">Register / রেজিস্টার করুন</a>
        </p>
    </div>

</body>
</html>
